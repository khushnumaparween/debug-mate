<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>DebugMate</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: auto;
            padding: 30px;
        }

        h1 {
            color: #38bdf8;
            text-align: center;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        input[type="text"] {
            width: 300px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        button {
            padding: 10px 20px;
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0ea5e9;
        }

        h2 {
            color: #38bdf8;
            margin-bottom: 15px;
        }

        ul {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        li {
            background: #1e293b;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            transition: 0.2s;
        }

        li:hover {
            background: #334155;
            transform: scale(1.03);
        }

        a {
            color: #e5e7eb;
            text-decoration: none;
            display: block;
        }

        a:hover {
            color: #38bdf8;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>DebugMate</h1>

    <form action="/search" method="get">
        <input type="text" name="keyword"
               placeholder="Search error, stacktrace, or cause...">
<!--        <input type="text" name="keyword" placeholder="Search errors...">-->
        <button type="submit">Search</button>
    </form>

    <h2>Categories</h2>

    <ul>
        <li><a href="/category/Spring Boot">Spring Boot</a></li>
        <li><a href="/category/Spring Core">Spring Core</a></li>
        <li><a href="/category/Spring MVC">Spring MVC</a></li>
        <li><a href="/category/Hibernate">Hibernate</a></li>
        <li><a href="/category/JPA">JPA</a></li>
        <li><a href="/category/Database">Database</a></li>
        <li><a href="/category/Security">Security</a></li>
        <li><a href="/category/Serialization">Serialization</a></li>
        <li><a href="/category/HTTP">HTTP</a></li>
        <li><a href="/category/File Upload">File Upload</a></li>
        <li><a href="/category/Build Tool">Build Tool</a></li>
        <li><a href="/category/Compilation">Compilation</a></li>
        <li><a href="/category/View Layer">View Layer</a></li>
        <li><a href="/category/Web">Web</a></li>
        <li><a href="/category/Server">Server</a></li>
        <li><a href="/category/HTTP Client">HTTP Client</a></li>
    </ul>

    <div class="footer">
        Created by Khushnuma Parween
    </div>

</div>

</body>
</html>
